<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Project Bastion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
:root{--canvas:#fff;--surface:#f8fafc;--surface-alt:#f1f5f9;--ink:#0f172a;--ink-muted:#475569;--ink-faint:#94a3b8;
--line:#e2e8f0;--line-strong:#cbd5e1;--accent:#2563eb;--accent-hover:#1d4ed8;--accent-soft:#eff6ff;
--ok:#16a34a;--ok-soft:#f0fdf4;--ok-border:#bbf7d0;--warn:#ca8a04;--warn-soft:#fefce8;--warn-border:#fde68a;
--crit:#dc2626;--crit-soft:#fef2f2;--crit-border:#fecaca;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sidebar-w:228px;--header-h:52px;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--surface);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}button{font-family:inherit;cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none;cursor:pointer}input,select{font-family:inherit;font-size:13px}
.app{display:grid;grid-template-rows:var(--header-h) 1fr;grid-template-columns:var(--sidebar-w) 1fr;grid-template-areas:"header header" "rail main";height:100vh;width:100vw}
.header{grid-area:header;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--header-h);padding:0 18px;background:var(--canvas);border-bottom:1px solid var(--line)}
.rail{grid-area:rail;background:var(--canvas);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.main{grid-area:main;overflow-y:auto;background:var(--surface)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-weight:700;font-size:13px;border-radius:5px;flex:none}
.brand-name{font-size:14px;font-weight:600}.brand-tag{font-size:12px;color:var(--ink-faint);margin-left:2px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}.livedot.on i{background:var(--ok)}.livedot.err i{background:var(--crit)}
.datectl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted)}
.datectl input{border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--ink)}
.rail-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:14px 18px 6px}
.rail-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 16px 7px 18px;font-size:13px;color:var(--ink-muted);border-left:2px solid transparent}
.rail-item:hover{background:var(--surface);color:var(--ink)}
.rail-item.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent);font-weight:500}
.rail-item .badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-alt);color:var(--ink-muted)}
.rail-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.page{padding:22px 28px 64px;max-width:1320px}.page-head{margin-bottom:18px}
.crumb{font-size:12.5px;color:var(--ink-muted);margin-bottom:8px}.crumb a:hover{text-decoration:underline}
.page-title{font-size:21px;font-weight:600;letter-spacing:-.01em}.page-sub{margin-top:4px;font-size:13px;color:var(--ink-muted);max-width:820px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 13px;border:1px solid var(--line);background:var(--canvas);border-radius:6px;color:var(--ink)}
.btn:hover{background:var(--surface);border-color:var(--line-strong)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.55;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:220px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--ink-muted);border-right:1px solid var(--line)}.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.stat-grid{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:16px}
.stat{background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:13px 15px}.stat.crit{border-color:var(--crit-border)}
.stat .l{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
.stat .v{font-size:23px;font-weight:600;margin-top:6px;letter-spacing:-.01em}.stat.crit .v{color:var(--crit)}
.stat .v .u{font-size:13px;font-weight:400;color:var(--ink-muted);margin-left:3px}.stat .s{margin-top:3px;font-size:11.5px;color:var(--ink-faint)}
.card{background:var(--canvas);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}.card-title .count{color:var(--ink-faint);font-weight:400;font-size:12px}
.card-body{padding:14px 16px}.card-body.flush{padding:0}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.ok .d{background:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.warn .d{background:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.crit .d{background:var(--crit)}
.pill.info{background:var(--surface-alt);color:var(--ink-muted)}.pill.info .d{background:var(--ink-faint)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}.row .nm{flex:1}
.bar{width:120px;height:6px;border-radius:999px;background:var(--surface-alt);overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);background:var(--surface);position:sticky;top:0}
td.num,th.num{text-align:right}td.muted{color:var(--ink-muted)}tbody tr.click{cursor:pointer}tbody tr:hover td{background:var(--surface)}
.interp{font-size:13px;line-height:1.6;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line)}.interp:last-child{border-bottom:none}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.plan{background:var(--canvas);border:1px solid var(--line);border-radius:8px;overflow:hidden}.plan.best{border-color:var(--accent)}
.plan .ph{padding:11px 14px;border-bottom:1px solid var(--line)}.plan .obj{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
.plan .nm{font-size:14px;font-weight:600;margin-top:2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .pb{padding:10px 14px;display:flex;flex-direction:column;gap:7px}.plan .pr{display:flex;justify-content:space-between;font-size:12.5px}
.plan .pr .lbl{color:var(--ink-muted)}.plan .pr .val{font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}.controls label{font-size:12.5px;color:var(--ink-muted)}
.banner{border-radius:8px;padding:11px 14px;margin-bottom:16px;font-size:13px}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn-border);color:#7a5c08}.banner.err{background:var(--crit-soft);border:1px solid var(--crit-border);color:#9b1c1c}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--warn);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-muted);margin-top:10px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%}
svg.chart{width:100%;height:auto;display:block}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-muted)}.meta b{color:var(--ink);font-weight:500}
/* map */
.mapbox{height:560px;border-radius:8px;overflow:hidden;background:#0b0e14;border:1px solid var(--line)}
.mk{border-radius:50%;cursor:pointer;border:1.5px solid rgba(255,255,255,.92);box-shadow:0 0 0 1.5px rgba(15,23,42,.55)}
.mk.s0{width:10px;height:10px;background:#16a34a}.mk.s1{width:11px;height:11px;background:#eab308}
.mk.s2{width:12px;height:12px;background:#f97316}.mk.s3{width:13px;height:13px;background:#ef4444;box-shadow:0 0 9px 2px rgba(239,68,68,.65)}
.mk.depot{width:15px;height:15px;background:#1e293b;border:2px solid #fff;border-radius:3px}
.mk.pass{width:11px;height:11px;border-radius:2px;transform:rotate(45deg);border:1.5px solid #fff}
.mk.pass.p-open{background:#16a34a}.mk.pass.p-mid{background:#eab308}.mk.pass.p-shut{background:#ef4444}
.maplibregl-popup-content{background:#11151c;color:#e7ecf3;border-radius:8px;padding:10px 12px;font-family:var(--font);font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.maplibregl-popup-content b{color:#fff}
.maplibregl-popup-tip{border-top-color:#11151c!important;border-bottom-color:#11151c!important}
.pop-btn{margin-top:8px;background:#2563eb;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:500;border:none;cursor:pointer}
@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"header" "rail" "main"}
  .header{flex-wrap:wrap;gap:8px;padding:9px 12px;height:auto}
  .brand-tag{display:none}
  .rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .rail-eyebrow,.rail-foot{display:none}
  .rail-item{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:11px 14px;width:auto}
  .rail-item.active{border-left:none;border-bottom-color:var(--accent)}
  .rail-item .badge{margin-left:6px}
  .page{padding:16px 14px 60px}
  .stat-grid,.plans{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}
  .mapbox{height:62vh}
  th,td{padding:7px 9px}
}
</style>
</head>

function LineChart({history,asOf,projection}){
  const W=860,H=320,pad={l:60,r:20,t:18,b:36};
  if(!history||!history.length)return <div className="muted" style={{padding:20}}>Loading history…</div>;
  const pts=history.map((h,i)=>({i,v:h.closing_stock}));

  /* ── Interpolate sparse projection points into daily steps ─────────── */
  const rawProj=(projection||[]).filter(p=>p.v!=null);
  const lastHist=pts[pts.length-1];
  let interpP50=[],interpP90=[];
  if(rawProj.length){
    const anchors=[{d:0,v:lastHist.v,v90:lastHist.v},...rawProj.map(p=>({d:p.offsetIdx||0,v:p.v,v90:p.v90!=null?p.v90:p.v}))];
    for(let k=0;k<anchors.length-1;k++){const a=anchors[k],b=anchors[k+1];const span=b.d-a.d;for(let s=0;s<=span;s++){const t=s/Math.max(span,1);const day=a.d+s;interpP50.push({i:history.length-1+day,v:a.v+(b.v-a.v)*t});interpP90.push({i:history.length-1+day,v:a.v90+(b.v90-a.v90)*t});}}
  }

  /* ── Y-axis: clamp floor at 0 but show a zero-line if projections go negative ── */
  const histVals=pts.map(p=>p.v);
  const projVals=interpP50.map(p=>p.v).concat(interpP90.map(p=>p.v));
  const rawMin=Math.min(...histVals,...(projVals.length?projVals:[0]));
  const hasNeg=rawMin<0;
  const minV=hasNeg?Math.min(rawMin,-Math.max(...histVals)*0.05):0;
  const maxV=Math.max(...histVals,...(projVals.length?projVals:[1]))*1.05;
  const N=history.length+(interpP50.length?interpP50[interpP50.length-1].i-history.length+2:0);

  const X=i=>pad.l+i/Math.max(N-1,1)*(W-pad.l-pad.r);
  const Y=v=>pad.t+(1-(v-minV)/((maxV-minV)||1))*(H-pad.t-pad.b);
  const Yclamp=v=>Y(Math.max(v,minV));

  /* ── Paths ─────────────────────────────────────────────────────────── */
  const histLine=pts.map((p,k)=>(k?"L":"M")+X(p.i)+" "+Y(p.v)).join(" ");
  const aoi=asOf?history.findIndex(h=>h.date===asOf):-1;

  /* Confidence band: filled area between P50 and P90 */
  let bandPath="",p50Line="",p90Line="";
  if(interpP50.length>1){
    p50Line="M"+interpP50.map(p=>X(p.i)+" "+Yclamp(p.v)).join(" L");
    p90Line="M"+interpP90.map(p=>X(p.i)+" "+Yclamp(p.v)).join(" L");
    const fwd=interpP50.map(p=>X(p.i)+" "+Yclamp(p.v)).join(" L");
    const rev=[...interpP90].reverse().map(p=>X(p.i)+" "+Yclamp(p.v)).join(" L");
    bandPath="M"+fwd+" L"+rev+" Z";
  }

  /* ── Y-axis ticks: nice round numbers ─────────────────────────────── */
  const yRange=maxV-minV;
  const rawStep=yRange/5;
  const mag=Math.pow(10,Math.floor(Math.log10(Math.abs(rawStep)||1)));
  const niceStep=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=rawStep)||rawStep;
  const ticks=[];
  const firstTick=Math.ceil(minV/niceStep)*niceStep;
  for(let t=firstTick;t<=maxV;t+=niceStep)ticks.push(t);
  if(ticks.length<3)for(let f=0;f<=1;f+=0.25)ticks.push(minV+f*yRange);

  /* ── X-axis date labels ────────────────────────────────────────────── */
  const xLabels=[];
  if(history.length>0){
    const step=Math.max(Math.floor(history.length/5),1);
    for(let j=0;j<history.length;j+=step){
      const d=history[j].date;
      if(d)xLabels.push({i:j,label:d.slice(5)});
    }
    if(interpP50.length){
      const lastProj=interpP50[interpP50.length-1];
      xLabels.push({i:lastProj.i,label:"+90d"});
    }
  }

  return <svg className="chart" viewBox={`0 0 ${W} ${H}`}>
    {/* Grid lines */}
    {ticks.map((t,i)=><g key={i}><line x1={pad.l} x2={W-pad.r} y1={Y(t)} y2={Y(t)} stroke="var(--line)" strokeWidth={t===0?"1.2":"0.8"}/><text x={pad.l-8} y={Y(t)+4} textAnchor="end" fontSize="10.5" fill="var(--ink-faint)">{fmt(t)}</text></g>)}
    {/* Zero line if projections go negative */}
    {hasNeg&&!ticks.includes(0)&&<line x1={pad.l} x2={W-pad.r} y1={Y(0)} y2={Y(0)} stroke="var(--ink-faint)" strokeWidth="1" strokeDasharray="2 2" opacity="0.5"/>}
    {/* As-of marker */}
    {aoi>=0&&<line x1={X(aoi)} x2={X(aoi)} y1={pad.t} y2={H-pad.b} stroke="var(--accent)" strokeDasharray="3 3" opacity="0.5"/>}
    {aoi>=0&&<text x={X(aoi)+4} y={pad.t+12} fontSize="10" fill="var(--accent)" fontWeight="500">as-of</text>}
    {/* Confidence band (P50–P90) */}
    {bandPath&&<path d={bandPath} fill="var(--crit)" opacity="0.08"/>}
    {/* P90 line (pessimistic) */}
    {p90Line&&<path d={p90Line} fill="none" stroke="var(--warn)" strokeWidth="1.3" strokeDasharray="4 3" opacity="0.65"/>}
    {/* P50 line (expected) */}
    {p50Line&&<path d={p50Line} fill="none" stroke="var(--crit)" strokeWidth="1.6" strokeDasharray="5 3"/>}
    {/* Historical line */}
    <path d={histLine} fill="none" stroke="var(--accent)" strokeWidth="1.8"/>
    {/* Projection anchor dots at actual model output horizons */}
    {rawProj.map((p,i)=><circle key={"p50-"+i} cx={X(history.length-1+(p.offsetIdx||0))} cy={Yclamp(p.v)} r="3" fill="var(--crit)"/>)}
    {rawProj.map((p,i)=><circle key={"p90-"+i} cx={X(history.length-1+(p.offsetIdx||0))} cy={Yclamp(p.v90!=null?p.v90:p.v)} r="2.5" fill="var(--warn)"/>)}
    {/* X-axis labels */}
    {xLabels.map((xl,i)=><text key={i} x={X(xl.i)} y={H-6} textAnchor={i===xLabels.length-1?"end":i===0?"start":"middle"} fontSize="10" fill="var(--ink-faint)">{xl.label}</text>)}
  </svg>;
}

function MapView({riskAll,passProb,go}){
  const ref=useRef(null),mapRef=useRef(null),loaded=useRef(false),markers=useRef([]);
  const goRef=useRef(go);goRef.current=go;
  const postStat=useMemo(()=>{
    const m={};
    riskAll.filter(r=>r.horizon_days===14).forEach(r=>{
      const k=r.post_id;const cur=m[k]||{sev:0,worst:"ok",minCover:Infinity,atRisk:0};
      if(r.predicted_status!=="ok")cur.atRisk++;
      cur.worst=worstStatus(cur.worst,r.predicted_status);
      const cov=r.projected_days_of_cover_p50;if(cov!=null)cur.minCover=Math.min(cur.minCover,cov);
      m[k]=cur;
    });
    Object.values(m).forEach(v=>{const c=v.minCover;v.sev=c===Infinity?0:c<7?3:c<21?2:c<45?1:0;if(v.worst==="stockout")v.sev=3;});
    return m;
  },[riskAll]);
  const statRef=useRef(postStat);statRef.current=postStat;
  const ppRef=useRef(passProb||{});ppRef.current=passProb||{};
  const passClass=(nm)=>{const p=ppRef.current[nm];if(p==null)return "p-mid";return p>=0.6?"p-open":p>=0.3?"p-mid":"p-shut";};
  const place=useCallback(()=>{
    const map=mapRef.current;if(!map)return;
    markers.current.forEach(m=>m.remove());markers.current=[];
    Object.entries(SCAFFOLD.passes).forEach(([nm,c])=>{
      const el=document.createElement("div");el.className="mk pass "+passClass(nm);el.title=nm;
      const m=new maplibregl.Marker({element:el}).setLngLat(c).addTo(map);
      el.addEventListener("click",()=>{const p=ppRef.current[nm];const node=document.createElement("div");
        node.innerHTML=`<b>${nm}</b><br/>${p!=null?("P(open) "+(p*100).toFixed(0)+"% at horizon"):"pass status n/a"}`;
        new maplibregl.Popup({offset:12}).setDOMContent(node).setLngLat(c).addTo(map);});
      markers.current.push(m);
    });
    Object.entries(SCAFFOLD.posts).forEach(([id,p])=>{
      const s=statRef.current[id];const cls=p.is_depot?"depot":("s"+((s&&s.sev)||0));
      const el=document.createElement("div");el.className="mk "+cls;el.title=p.name;
      const m=new maplibregl.Marker({element:el}).setLngLat([p.lon,p.lat]).addTo(map);
      el.addEventListener("click",()=>{
        const node=document.createElement("div");
        const sevTxt=p.is_depot?"depot":(s?(["healthy","watch","warning","critical"][s.sev]+(s.minCover<Infinity?" · ~"+Math.round(s.minCover)+"d cover":"")):"no risk data");
        node.innerHTML=`<b>${p.name}</b><br/>${p.axis} · ${p.band} · ${fmt(p.elev_m)} m<br/>${sevTxt}${s&&s.atRisk?(" · "+s.atRisk+" SKU"+(s.atRisk>1?"s":"")+" at risk"):""}`;
        const btn=document.createElement("button");btn.className="pop-btn";btn.textContent="Open post →";
        const pop=new maplibregl.Popup({offset:14}).setDOMContent(node).setLngLat([p.lon,p.lat]).addTo(map);
        btn.onclick=()=>{pop.remove();goRef.current("post",{post:id});};node.appendChild(btn);
      });
      markers.current.push(m);
    });
  },[]);
  useEffect(()=>{
    if(mapRef.current||!window.maplibregl||!ref.current)return;
    const map=new maplibregl.Map({container:ref.current,
      style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
      center:[78.0,34.0],zoom:6.6,attributionControl:true});
    map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    map.on("load",()=>{
      const P=SCAFFOLD.posts;const routes=SCAFFOLD.routes||[];
      const feats=routes.filter(r=>P[r.o]&&P[r.d]).map(r=>{
        const worst=(r.passes||[]).reduce((acc,pn)=>{const p=(passProb||{})[pn];return p==null?acc:Math.min(acc,p);},1);
        return {type:"Feature",properties:{worst},geometry:{type:"LineString",coordinates:[[P[r.o].lon,P[r.o].lat],[P[r.d].lon,P[r.d].lat]]}};
      });
      map.addSource("routes",{type:"geojson",data:{type:"FeatureCollection",features:feats}});
      map.addLayer({id:"routes",type:"line",source:"routes",
        paint:{"line-width":1.4,"line-opacity":0.75,"line-color":["interpolate",["linear"],["get","worst"],0,"#ef4444",0.3,"#f97316",0.6,"#eab308",1,"#64748b"]}});
      const b=new maplibregl.LngLatBounds();Object.values(P).forEach(p=>b.extend([p.lon,p.lat]));Object.values(SCAFFOLD.passes).forEach(c=>b.extend(c));
      map.fitBounds(b,{padding:48,maxZoom:8.5});
      loaded.current=true;place();
    });
    mapRef.current=map;
  },[place]);
  useEffect(()=>{if(loaded.current)place();},[postStat,passProb,place]);
  return <div ref={ref} className="mapbox"/>;
}

function App(){
  const [route,setRoute]=useState("posts");
  const [snap,setSnap]=useState(null),[opt,setOpt]=useState(null);
  const [asOf,setAsOf]=useState(DEFAULT_DATE),[horizon,setHorizon]=useState(14);
  const [phase,setPhase]=useState("init"),[busy,setBusy]=useState(false),[err,setErr]=useState(null);
  const [sel,setSel]=useState({post:null,sku:null,vehicle:null,plan:null});
  const load=useCallback(async(date,h)=>{setBusy(true);setErr(null);setPhase(p=>p==="ready"?"ready":"waking");
    try{const [s,o]=await Promise.all([getJSON(`/snapshot?date=${date}&at_risk_only=false`),getJSON(`/optimize?date=${date}&horizon=${h}`)]);setSnap(s);setOpt(o);setPhase("ready");}
    catch(e){setErr(String(e.message||e));setPhase("error");}setBusy(false);},[]);
  useEffect(()=>{load(asOf,horizon);},[]);// eslint-disable-line

    <div className="page-head"><div className="page-title">Vehicles</div><div className="page-sub">Every vehicle scored live for the mission window. Click a vehicle for its reliability by horizon and full breakdown history.</div></div>
    <div className="toolbar"><input className="search" placeholder="Search vehicle…" value={q} onChange={e=>setQ(e.target.value)}/><div className="seg">{classes.map(c=><button key={c} className={cls===c?"on":""} onClick={()=>setCls(c)}>{c==="all"?"All classes":c}</button>)}</div><span style={{color:"var(--ink-faint)",fontSize:12}}>{rows.length} vehicles</span></div>
    <div className="card"><div className="card-body flush"><table><thead><tr><th>Vehicle</th><th>Class</th><th>Home depot</th><th>Axis</th><th className="num">Past events</th><th className="num">Reliability</th><th className="num">P(deadline)</th><th>Status</th></tr></thead><tbody>
      {rows.map(v=><tr key={v.vehicle_id} className="click" onClick={()=>go("vehicle",{vehicle:v.vehicle_id})}><td><a>{v.vehicle_id}</a></td><td className="muted">{v.vehicle_class}</td><td className="muted">{postName(v.home_depot_id)}</td><td className="muted">{v.home_axis}</td><td className="num">{v.events_to_date}</td><td className="num" style={{color:`var(--${relKind(v.reliability_score)})`}}>{fmt(v.reliability_score,2)}</td><td className="num">{pct(v.p_deadline)}</td><td><Pill kind={relKind(v.reliability_score)}>{relKind(v.reliability_score)==="ok"?"healthy":relKind(v.reliability_score)==="warn"?"watch":"at risk"}</Pill></td></tr>)}
    </tbody></table></div></div>
  </>);
}
function VehicleDetail({vehicle,vehAll,go}){
  const rows=vehAll.filter(v=>v.vehicle_id===vehicle).sort((a,b)=>a.horizon_days-b.horizon_days);
  const base=rows.find(r=>r.horizon_days===14)||rows[rows.length-1]||rows[0]||{};
  const spec=SCAFFOLD.vehicles[vehicle]||{};
  const events=(SCAFFOLD.vehicle_events[vehicle]||[]).slice().sort((a,b)=>a.deadline<b.deadline?1:-1);
  return (<>
    <div className="page-head"><div className="crumb"><a onClick={()=>go("vehicles")}>Vehicles</a> › {vehicle}</div><div className="page-title">{vehicle}</div>
      <div className="meta" style={{marginTop:8}}><span>Class <b>{base.vehicle_class}</b></span><span>Payload <b>{fmt(spec.payload,1)} t</b></span><span>Home depot <b>{postName(base.home_depot_id)}</b></span><span>Axis <b>{base.home_axis}</b></span><span>High-altitude use <b>{pct(base.frac_high_altitude)}</b></span></div>
    </div>
    <div className="stat-grid"><Stat label={`Reliability (${base.horizon_days||7}d)`} value={fmt(base.reliability_score,2)} crit={(base.reliability_score??1)<0.4}/><Stat label={`P(deadline ${base.horizon_days||7}d)`} value={pct(base.p_deadline)}/><Stat label="Effective age" value={fmt(base.effective_age_days)} unit="d" sub={"actual "+fmt(base.age_days_at_asof)+"d"}/><Stat label="Past breakdowns" value={base.events_to_date} crit={base.events_to_date>3}/></div>
    <div className="split">
      <div className="card"><div className="card-head"><div className="card-title">Reliability by horizon <span className="count">live scorer</span></div></div><div className="card-body flush"><table><thead><tr><th>Horizon</th><th className="num">Reliability</th><th className="num">P(deadline)</th><th className="num">Effective age</th></tr></thead><tbody>{rows.map((r,i)=><tr key={i}><td>{r.horizon_days} days</td><td className="num" style={{color:`var(--${relKind(r.reliability_score)})`}}>{fmt(r.reliability_score,2)}</td><td className="num">{pct(r.p_deadline)}</td><td className="num">{fmt(r.effective_age_days)}d</td></tr>)}</tbody></table></div></div>
      <div className="card"><div className="card-head"><div className="card-title">Reliability model</div></div><div className="card-body"><div className="meta" style={{flexDirection:"column",gap:8}}><span>Scorer <b>{base.scorer_kind}</b></span><span>Weibull shape <b>{fmt(spec.wshape,2)}</b></span><span>Weibull scale <b>{fmt(spec.wscale)} d</b></span><span>Initial age <b>{fmt(spec.init_age)} d</b></span></div><p style={{fontSize:12,color:"var(--ink-muted)",marginTop:10,lineHeight:1.5}}>Each repair resets effective age; high-altitude duty accelerates wear, raising deadline probability.</p></div></div>
    </div>
    <div className="card"><div className="card-head"><div className="card-title">Breakdown history <span className="count">{events.length} events</span></div></div><div className="card-body flush">
      {events.length===0?<div className="card-body muted">No recorded breakdowns.</div>:
      <table><thead><tr><th>Deadline date</th><th>Returned</th><th className="num">Days down</th><th>Repaired at</th><th>Season</th></tr></thead><tbody>{events.map((e,i)=><tr key={i}><td>{e.deadline}</td><td className="muted">{e.return}</td><td className="num">{e.repair_days}</td><td className="muted">{e.where}</td><td>{e.winter?<Pill kind="warn">winter</Pill>:<Pill kind="info">summer</Pill>}</td></tr>)}</tbody></table>}
    </div></div>
  </>);
}
function Provenance({diag,snap}){
  const L=diag||{};
  return (<>
    <div className="page-head"><div className="page-title">Provenance</div><div className="page-sub">Where these numbers come from. Every output is generated on request by versioned models against a fixed synthetic world.</div></div>
    <div className="card"><div className="card-body"><table><tbody>
      <tr><td className="muted">Model version</td><td>{L.model_version||"–"}</td></tr><tr><td className="muted">Snapshot date</td><td>{L.snapshot_date||"–"}</td></tr><tr><td className="muted">Data seed</td><td className="num">{L.data_snapshot_seed??"–"}</td></tr><tr><td className="muted">Computed at</td><td className="num">{L.generated_at||"–"}</td></tr><tr><td className="muted">Predictions in snapshot</td><td className="num">{snap?`${fmt(snap.counts.demand)} demand · ${fmt(snap.counts.route)} route · ${fmt(snap.counts.risk)} risk`:"–"}</td></tr><tr><td className="muted">Raw history</td><td className="num">35 posts × 30 SKUs × 1,096 days</td></tr><tr><td className="muted">Model service</td><td>{API_BASE.replace("https://","")}</td></tr>
    </tbody></table><p style={{fontSize:12.5,color:"var(--ink-muted)",lineHeight:1.6,marginTop:14}}>The raw synthetic world is fixed at seed 42 and does not change. The demand forecaster, route classifier, vehicle scorer, risk composer and OR-Tools optimizer run on request and produce every figure shown. Proofs of functionality on synthetic data, not real-world accuracy claims.</p></div></div>
  </>);
}

/* ── v3.2: scenario wargaming + wartime mode ─────────────────────────────── */
const PASSES=Object.keys(SCAFFOLD.passes);
const PlanCards=({plans,diff})=>(
  <div className="plans">{plans.map(p=>{
    const d=diff&&diff[p.objective];
    return <div className="plan" key={p.plan_id}>
      <div className="ph"><div className="obj">{p.objective.replace(/_/g," ")}</div><div className="nm">{p.objective.replace(/_/g," ")}</div></div>
      <div className="pb">
        <div className="pr"><span className="lbl">Coverage (reachable)</span><span className="val num">{fmt(p.coverage_reachable_pct,1)}%</span></div>
        <div className="pr"><span className="lbl">Cost</span><span className="val num">₹{fmt(p.total_cost)}</span></div>
        <div className="pr"><span className="lbl">Convoys / risky</span><span className="val num">{fmt(p.convoys)} / {fmt(p.risky_sorties)}</span></div>
        <div className="pr"><span className="lbl">Exp. in-transit loss</span><span className="val num">{fmt(p.expected_loss_tonnes,1)} t</span></div>
        <div className="pr"><span className="lbl">Road-isolated</span><span className="val num">{fmt(p.isolated_tonnes,1)} t</span></div>
        <div className="pr"><span className="lbl">Dispatch days</span><span className="val num">{Array.isArray(p.dispatch_days_used)?p.dispatch_days_used.join(", "):String(p.dispatch_days_used||"–")}</span></div>
        {d&&<div className="pr"><span className="lbl">vs peacetime baseline</span><span className="val num" style={{color:(d.coverage_reachable_pct||0)<0?"var(--crit)":"var(--ok)"}}>{(d.coverage_reachable_pct>0?"+":"")+fmt(d.coverage_reachable_pct,1)}% cov · {(d.total_cost>0?"+":"")+"₹"+fmt(d.total_cost)}</span></div>}
      </div></div>;})}
  </div>);

function WargameScreen({asOf,opt,go}){
  const [mode,setMode]=useState("peacetime");
  const [closures,setClosures]=useState({});       // pass -> % open (0..100)
  const [surgePost,setSurgePost]=useState("all"),[surge,setSurge]=useState(1);
  const [depotKnock,setDepotKnock]=useState("none");
  const [vehLoss,setVehLoss]=useState(0);
  const [res,setRes]=useState(null),[running,setRunning]=useState(false),[err,setErr]=useState(null);
  const [saved,setSaved]=useState(loadSaved());
  const depots=Object.keys(SCAFFOLD.posts).filter(id=>SCAFFOLD.posts[id].is_depot);
  const run=async()=>{
    setRunning(true);setErr(null);
    const scenario={};
    const pc={};PASSES.forEach(p=>{if(closures[p]!=null&&closures[p]<100)pc[p]=closures[p]/100;});
    if(Object.keys(pc).length)scenario.pass_closures=pc;
    if(surge!==1)scenario.demand_multiplier=surgePost==="all"?surge:{[surgePost]:surge};
    if(depotKnock!=="none")scenario.depot_stock_factor={[depotKnock]:0};
    if(vehLoss>0)scenario.vehicle_loss_pct=vehLoss;
    try{const r=await postJSON("/whatif",{date:asOf,scenario,mode});setRes(r);}
    catch(e){setErr(String(e.message||e));}
    setRunning(false);
  };
  const savePlan=p=>{const l=[...saved,{...p,saved_at:new Date().toISOString(),label:(mode==="wartime"?"WARTIME ":"")+p.objective+" · "+asOf}];setSaved(l);storeSaved(l);};
  return (<>
    <div className="page-head"><div className="page-title">Wargame</div><div className="page-sub">Stress the plan before reality does. Close passes, surge demand, destroy depot stock, attrit the fleet — then re-solve the full frontier live. Wartime mode re-prioritises: ammunition becomes Tier-1, tempo and coverage outrank cost, exposure tolerance rises, and a max-tempo plan (earliest feasible dispatch) replaces min-cost.</div></div>
    <div className="card"><div className="card-head"><div className="card-title">Posture</div></div><div className="card-body">
      <div className="seg" style={{marginBottom:14}}>{["peacetime","wartime"].map(m=><button key={m} className={mode===m?"on":""} onClick={()=>setMode(m)} style={mode===m&&m==="wartime"?{background:"var(--crit)",color:"#fff"}:{}}>{m==="wartime"?"⚠ Wartime":"Peacetime"}</button>)}</div>
      <div style={{fontSize:12.5,color:"var(--ink-muted)",marginBottom:14}}>Pass availability (% of forecast P(open) — 0 = demolished/interdicted)</div>
      {PASSES.map(p=><div className="row" key={p}><span className="nm">{p}</span><input type="range" min="0" max="100" value={closures[p]??100} onChange={e=>setClosures({...closures,[p]:+e.target.value})} style={{flex:1}}/><span className="num" style={{width:42,textAlign:"right"}}>{closures[p]??100}%</span></div>)}
      <div className="row" style={{marginTop:10}}><span className="nm">Demand surge</span>
        <select value={surgePost} onChange={e=>setSurgePost(e.target.value)}><option value="all">All posts</option>{Object.keys(SCAFFOLD.posts).filter(id=>!SCAFFOLD.posts[id].is_depot).map(id=><option key={id} value={id}>{postName(id)}</option>)}</select>
        <input type="range" min="1" max="4" step="0.5" value={surge} onChange={e=>setSurge(+e.target.value)} style={{flex:1}}/><span className="num" style={{width:42,textAlign:"right"}}>{surge}×</span></div>
      <div className="row"><span className="nm">Depot destroyed</span><select value={depotKnock} onChange={e=>setDepotKnock(e.target.value)}><option value="none">None</option>{depots.map(d=><option key={d} value={d}>{postName(d)}</option>)}</select></div>
      <div className="row"><span className="nm">Fleet attrition</span><input type="range" min="0" max="80" step="5" value={vehLoss} onChange={e=>setVehLoss(+e.target.value)} style={{flex:1}}/><span className="num" style={{width:42,textAlign:"right"}}>{vehLoss}%</span></div>
      <button className="btn" disabled={running} onClick={run} style={{marginTop:14}}>{running?"Solving… (~30–60 s, live optimization)":"Run scenario"}</button>
      {err&&<div className="banner err" style={{marginTop:10}}>Scenario failed: {err}</div>}
    </div></div>
    {res&&<>
      <div className="page-head" style={{marginTop:18}}><div className="page-title" style={{fontSize:17}}>{res.mode==="wartime"?"⚠ Wartime plans":"Scenario plans"}</div><div className="page-sub">Each card shows the change against the unmodified peacetime baseline solved with identical settings — the diff is the scenario's true effect.</div></div>
      <PlanCards plans={res.plans} diff={res.diff_vs_baseline}/>
      <div className="card"><div className="card-head"><div className="card-title">Keep a plan</div></div><div className="card-body">{res.plans.map(p=><button key={p.plan_id} className="btn" style={{marginRight:8,marginBottom:8}} onClick={()=>savePlan(p)}>Save {p.objective.replace(/_/g," ")}</button>)}</div></div>
    </>}
    {saved.length>0&&<div className="card"><div className="card-head"><div className="card-title">Saved plans <span className="count">{saved.length} · stored in this browser</span></div><button className="btn" onClick={()=>{setSaved([]);storeSaved([]);}}>Clear</button></div><div className="card-body flush">
      <table><thead><tr><th>Plan</th><th className="num">Coverage</th><th className="num">Cost</th><th className="num">Convoys</th><th className="num">Saved</th></tr></thead><tbody>
        {saved.slice().reverse().map((p,i)=><tr key={i}><td>{p.label||p.objective}</td><td className="num">{fmt(p.coverage_reachable_pct,1)}%</td><td className="num">₹{fmt(p.total_cost)}</td><td className="num">{p.convoys}</td><td className="num">{(p.saved_at||"").slice(0,16).replace("T"," ")}</td></tr>)}
      </tbody></table></div></div>}
  </>);
}

/* ── v3.2: editable plans → re-optimized custom plan ─────────────────────── */
function PlanEditor({baseLegs,asOf}){
  const init=useMemo(()=>{const m={};(baseLegs||[]).forEach(l=>{const k=l.post_id+"|"+l.sku_id;m[k]=(m[k]||0)+(l.qty||0);});return Object.entries(m).map(([k,q])=>{const [p,s]=k.split("|");return {post_id:p,sku_id:s,qty:Math.round(q)};});},[baseLegs]);
  const [items,setItems]=useState(init);
  const [addPost,setAddPost]=useState("P018"),[addSku,setAddSku]=useState("RAT-001"),[addQty,setAddQty]=useState(100);
  const [out,setOut]=useState(null),[running,setRunning]=useState(false),[err,setErr]=useState(null),[savedMsg,setSavedMsg]=useState(false);
  useEffect(()=>{setItems(init);setOut(null);},[init]);
  const setQty=(i,q)=>{const c=[...items];c[i]={...c[i],qty:Math.max(0,Math.round(+q||0))};setItems(c);};
  const run=async()=>{setRunning(true);setErr(null);
    try{const r=await postJSON("/custom_plan",{date:asOf,items:items.filter(it=>it.qty>0),name:"custom"});setOut(r);}
    catch(e){setErr(String(e.message||e));}
    setRunning(false);};
  const save=()=>{const l=loadSaved();l.push({...out,saved_at:new Date().toISOString(),label:"CUSTOM · "+asOf});storeSaved(l);setSavedMsg(true);setTimeout(()=>setSavedMsg(false),2000);};
  return (<div className="card"><div className="card-head"><div className="card-title">Edit this plan <span className="count">change quantities, add or drop deliveries, then re-optimize</span></div></div><div className="card-body">
    <div className="card-body flush" style={{maxHeight:320,overflow:"auto",border:"1px solid var(--line)",borderRadius:8}}>
      <table><thead><tr><th>Post</th><th>Item</th><th className="num">Quantity (units)</th><th></th></tr></thead><tbody>
        {items.map((it,i)=><tr key={it.post_id+it.sku_id}><td>{postName(it.post_id)}</td><td className="muted">{skuName(it.sku_id)}</td><td className="num"><input type="number" min="0" value={it.qty} onChange={e=>setQty(i,e.target.value)} style={{width:90,textAlign:"right"}}/></td><td><a onClick={()=>setItems(items.filter((_,j)=>j!==i))} style={{color:"var(--crit)",cursor:"pointer"}}>remove</a></td></tr>)}
      </tbody></table></div>
    <div className="row" style={{marginTop:12}}>
      <select value={addPost} onChange={e=>setAddPost(e.target.value)}>{Object.keys(SCAFFOLD.posts).filter(id=>!SCAFFOLD.posts[id].is_depot).map(id=><option key={id} value={id}>{postName(id)}</option>)}</select>
      <select value={addSku} onChange={e=>setAddSku(e.target.value)}>{Object.keys(SCAFFOLD.skus).map(id=><option key={id} value={id}>{skuName(id)}</option>)}</select>
      <input type="number" min="1" value={addQty} onChange={e=>setAddQty(+e.target.value)} style={{width:90}}/>
      <button className="btn" onClick={()=>setItems([...items,{post_id:addPost,sku_id:addSku,qty:Math.max(1,Math.round(addQty))}])}>Add delivery</button>
    </div>
    <button className="btn" disabled={running} onClick={run} style={{marginTop:12}}>{running?"Re-optimizing… (~20–40 s)":"Re-optimize custom plan"}</button>
    {err&&<div className="banner err" style={{marginTop:10}}>{err}</div>}
    {out&&<>
      <div className="stat-grid" style={{marginTop:14}}>
        <Stat label="Delivered" value={fmt(out.covered_tonnes,1)} unit="t"/>
        <Stat label="Cost" value={"₹"+fmt(out.total_cost)}/>
        <Stat label="Convoys / vehicles" value={fmt(out.convoys)+" / "+fmt(out.vehicles_used)}/>
        <Stat label="Exp. in-transit loss" value={fmt(out.expected_loss_tonnes,1)} unit="t"/>
      </div>
      {out.clamped_requests&&out.clamped_requests.length>0&&<div className="banner warn" style={{marginTop:10}}>Some quantities were clamped to available depot stock or road feasibility: {out.clamped_requests.slice(0,4).map(c=>`${postName(c.post_id)} ${skuName(c.sku_id)} ${fmt(c.requested)}→${fmt(c.granted)}`).join("; ")}{out.clamped_requests.length>4?` (+${out.clamped_requests.length-4} more)`:""}</div>}
      <div style={{marginTop:10}}><button className="btn" onClick={save}>{savedMsg?"Saved ✓":"Save custom plan"}</button><span className="muted" style={{marginLeft:10,fontSize:12}}>{out.legs?out.legs.length:0} delivery legs · departure days {Array.isArray(out.dispatch_days_used)?out.dispatch_days_used.join(", "):"–"}</span></div>
    </>}
  </div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
