name: Load Bastion world into Supabase

# Manual trigger only — click "Run workflow" in the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r db/requirements.txt

      - name: Load world + predictions into Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # set in repo Settings → Secrets
          BASTION_ROOT: "."
          BASTION_LOAD_FROM: "2024-01-01"             # 12-month window → fits free tier (~195 MB)
        run: python db/load_world.py
